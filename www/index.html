<style>
/* Layout: single-column phone app, sticky header, content cards, fixed bottom tab bar + floating add button */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --sunk:#E8ECEA; --fg:#17211D; --muted:#66736E; --line:#DCE2DF;
  --accent:#12805C; --accent-soft:#D6EFE5; --ink:#0E3B2E;
  --good:#12805C; --warn:#C47A0C; --bad:#D2453A; --income:#2F6FDB;
  --font:"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --sunk:#222C28; --fg:#E7EEEA; --muted:#93A19B; --line:#2A3531;
  --accent:#3CC594; --accent-soft:#173A2E; --ink:#BFF0DC; --good:#3CC594; --warn:#E9A23B; --bad:#F06A5E; --income:#6FA0FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --sunk:#222C28; --fg:#E7EEEA; --muted:#93A19B; --line:#2A3531;
  --accent:#3CC594; --accent-soft:#173A2E; --ink:#BFF0DC; --good:#3CC594; --warn:#E9A23B; --bad:#F06A5E; --income:#6FA0FF; color-scheme:dark}
*{box-sizing:border-box}
.brand{display:flex;align-items:center;gap:12px;justify-content:center;padding:8px 0 4px;color:var(--muted)}
.brand img{width:44px;height:44px;border-radius:14px}
.brand b{display:block;color:var(--fg)}
.brand small{font-size:12.5px}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.syncdot.ok{background:var(--good)} .syncdot.err{background:var(--bad)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 140px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:14px 10px}
header.top h1{font-size:20px;font-weight:800;margin:0;flex:1;letter-spacing:-.01em}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthnav button{width:32px;height:32px;border-radius:999px;font-size:18px;color:var(--muted)}
.monthnav button:hover{background:var(--sunk)}
.monthnav span{font-weight:600;font-size:14px;min-width:84px;text-align:center}
section{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.banner span,.ins span,.hint{min-width:0;overflow-wrap:anywhere}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero{background:var(--ink);color:var(--bg);border:0}
:root .hero .label{color:inherit;opacity:.7}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:4px 0 10px}
.hero .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero .row3 div{min-width:0}
.hero .row3 b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.hero .bar{background:color-mix(in srgb,var(--bg) 22%,transparent)}
.hero .bar i{background:var(--bg)}
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.quick button{padding:0 16px;border-radius:12px;background:var(--accent);color:var(--surface);font-weight:700}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.preview{font-size:13px;margin-top:8px;color:var(--accent);font-weight:600;min-height:1em}
.insights{display:grid;gap:8px}
.ins{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--sunk);font-size:13.5px}
.ins .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--accent)}
.ins.warn .dot{background:var(--warn)} .ins.bad .dot{background:var(--bad)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.sechead h2{font-size:16px;margin:0;font-weight:700}
.link{color:var(--accent);font-weight:600;font-size:13px}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.tx:first-child{border-top:0}
.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .mid b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid small{color:var(--muted);font-size:12.5px}
.amt{font-weight:700;white-space:nowrap}
.amt.in{color:var(--income)}
.dayhead{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;padding:14px 0 2px}
.budrow{display:grid;gap:6px;padding:8px 0}
.budrow .t{display:flex;justify-content:space-between;font-size:13.5px;gap:8px}
.budrow .t span:first-child{font-weight:600}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:14px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:4px}
.cal button{aspect-ratio:1/1.08;border-radius:10px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 2px;gap:2px;min-width:0;max-width:100%}
.cal button.out{visibility:hidden}
.cal button.today{outline:2px solid var(--accent)}
.cal button.sel{background:var(--accent);color:var(--surface)}
.cal button.sel small{color:inherit}
.cal b{font-size:13px;font-weight:600}
.cal small{font-size:9.5px;color:var(--muted);max-width:100%;overflow:hidden;white-space:nowrap}
.cal small.hot{color:var(--bad);font-weight:600}
/* report */
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.donutwrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:400px){.donutwrap{grid-template-columns:1fr;justify-items:center}}
.legend{display:grid;gap:7px;width:100%;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg text{fill:var(--muted);font-family:var(--font)}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;width:100%}
nav.tabs button{padding:9px 0 10px;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--accent)}
nav.tabs .add{align-self:start;margin-top:-18px;width:56px;height:56px;justify-self:center;border-radius:18px;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-size:30px;font-weight:400;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:92%;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0;font-size:17px}
.typetog{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px}
.typetog button{padding:9px;border-radius:10px;font-weight:600;color:var(--muted)}
.typetog button.on{background:var(--surface);color:var(--fg)}
.typetog button.on.ex{color:var(--bad)} .typetog button.on.inc{color:var(--income)}
.amtin{font-size:32px;font-weight:800;border:0;border-bottom:2px solid var(--line);background:none;width:100%;padding:4px 0;outline:none}
.amtin:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:6px 10px;border-radius:999px;background:var(--sunk);font-size:12.5px;font-weight:600}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.catgrid button{display:grid;justify-items:center;gap:4px;padding:8px 2px;border-radius:12px;font-size:11.5px;border:2px solid transparent;min-width:0}
.catgrid button span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catgrid button.on{border-color:var(--accent);background:var(--accent-soft)}
.field{display:grid;gap:5px}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select{padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);width:100%;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.btn{padding:13px;border-radius:12px;font-weight:700;text-align:center}
.btn.pri{background:var(--accent);color:var(--surface)}
.btn.ghost{background:var(--sunk)}
.btn.danger{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.setrow:first-of-type{border-top:0}
.setrow .mid{flex:1;min-width:0}
.setrow small{display:block;color:var(--muted);font-size:12.5px}
.banner{background:var(--accent-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.banner span{flex:1}
.banner button{font-weight:700;color:var(--accent);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:30;max-width:calc(100% - 32px)}
textarea{width:100%;min-height:120px;border-radius:11px;border:1px solid var(--line);background:var(--bg);padding:10px;font:12px/1.4 ui-monospace,monospace;color:var(--fg)}
.emojis{display:flex;flex-wrap:wrap;gap:4px}
.emojis button{width:38px;height:38px;border-radius:10px;font-size:19px}
.emojis button.on{background:var(--accent-soft);outline:2px solid var(--accent)}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors button{width:30px;height:30px;border-radius:50%}
.colors button.on{outline:3px solid var(--fg);outline-offset:2px}
</style>

<script>

// recurring: create missing entries up to today
function runRecurring(){
  const today=new Date();let added=0;
  for(const r of S.recurring){
    let start=r.from?parseYMD(r.from):new Date(today.getFullYear(),today.getMonth(),1);
    for(let d=new Date(start.getFullYear(),start.getMonth(),1);d<=today;d.setMonth(d.getMonth()+1)){
      const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
      const day=new Date(d.getFullYear(),d.getMonth(),Math.min(r.day,last));
      if(day>today||day<start)continue;
      const key=r.id+'@'+ymd(day).slice(0,7);
      if(S.tx.some(t=>t.rec===key))continue;
      if(S.isSample && S.tx.some(t=>t.date===ymd(day)&&t.cat===r.cat&&t.amt===r.amt)) continue;
      S.tx.push({id:recId(key),date:ymd(day),cat:r.cat,amt:r.amt,note:r.note,type:r.type,rec:key});added++;
    }
    if(!r.from) r.from=ymd(new Date(today.getFullYear(),today.getMonth(),1));
  }
  if(added) save();
}

// ---------- Smart parse ----------
function parseQuick(text){
  let s=' '+text.trim()+' ';let date=new Date();const n=norm(s);
  if(/ hom qua /.test(n)){date.setDate(date.getDate()-1);s=s.replace(/hôm qua|hom qua/i,' ')}
  else if(/ hom kia /.test(n)){date.setDate(date.getDate()-2);s=s.replace(/hôm kia|hom kia/i,' ')}
  else{const yd=s.match(/yesterday|昨天|昨日|어제|เมื่อวาน/i);if(yd){date.setDate(date.getDate()-1);s=s.replace(yd[0],' ')}}
  const dm=s.match(/\b(\d{1,2})\/(\d{1,2})\b/);if(dm){date=new Date(date.getFullYear(),+dm[2]-1,+dm[1]);s=s.replace(dm[0],' ')}
  const re=/(\d+(?:[.,]\d+)*)\s*(k|nghìn|nghin|ngàn|ngan|tr|triệu|trieu|m|củ|cu|đ|d|vnd)?(?=\s|$)/i;
  const am=s.match(re);if(!am)return null;
  let v=am[1];const u=(am[2]||'').toLowerCase();
  if(/^(k|ngh|ng)/.test(norm(u))) v=parseFloat(v.replace(',','.'))*1e3;
  else if(/^(tr|tri|m|cu)/.test(norm(u))) v=parseFloat(v.replace(',','.'))*1e6;
  else { v=parseFloat(v.replace(/[.,]/g,'')); if(v<1000) v*=1000; }
  const note=s.replace(am[0],' ').replace(/\s+/g,' ').trim();
  const c=guessCat(note);
  return {amt:Math.round(v),note:note?note[0].toUpperCase()+note.slice(1):c.name,cat:c.id,type:c.type,date:ymd(date)};
}
function guessCat(note){
  const n=norm(note);
  if(S.learn[n]&&S.cats.find(c=>c.id===S.learn[n])) return cat(S.learn[n]);
  let best=null,bl=0;
  for(const c of S.cats){for(const k of (c.kw||[]).concat([c.name,T(c.name)])){const kn=norm(k);if(kn&&(' '+n+' ').includes(kn)&&kn.length>bl){best=c;bl=kn.length}}}
  for(const k in S.learn){ if(k&&n.includes(k)&&k.length>bl){best=cat(S.learn[k]);bl=k.length} }
  return best||S.cats.find(c=>c.id==='khac')||S.cats[0];
}
function learn(note,catId){const n=norm(note||'').trim();if(n&&n.length<40){S.learn[n]=catId}}

function insights(k){
  const tx=inMonth(k),spent=sum(tx,'ex'),inc=sum(tx,'in'),out=[];
  const now=new Date(),isCur=k===monthKey(now);
  const days=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
  const prev=new Date(cur.getFullYear(),cur.getMonth()-1,1),pk=monthKey(prev),ptx=inMonth(pk);
  if(isCur&&spent>0){
    const d=now.getDate(),fixed=tx.filter(t=>t.type==='ex'&&t.rec).reduce((a,t)=>a+t.amt,0);
    const varSp=spent-fixed,proj=fixed+varSp/d*days;
    const lvl=S.totalBudget&&proj>S.totalBudget?'bad':'';
    out.push({c:lvl,t:T('Theo nhịp hiện tại, cuối tháng bạn sẽ chi khoảng {0}.',`<b class="num">${fmt(proj)}</b>`+(S.totalBudget?' '+T('(ngân sách {0})',fmtS(S.totalBudget)):''))});
    if(S.totalBudget){const left=S.totalBudget-spent,dl=days-d+1;
      out.push(left>0?{c:'',t:T('Bạn có thể tiêu {0}/ngày trong {1} ngày còn lại mà vẫn giữ ngân sách.',`<b class="num">${fmt(left/dl)}</b>`,dl)}:{c:'bad',t:T('Bạn đã vượt ngân sách tháng {0}.',`<b class="num">${fmt(-left)}</b>`)});}
  }
  // category vs last month (same day-of-month window when current)
  const lim=isCur?now.getDate():99;
  const byCat=(arr,cut)=>{const m={};arr.filter(t=>t.type==='ex'&&+t.date.slice(8)<=cut).forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amt);return m};
  const a=byCat(tx,lim),b=byCat(ptx,lim);let worst=null;
  for(const id in a){const diff=a[id]-(b[id]||0);if(b[id]&&diff>0&&diff/b[id]>.25&&(!worst||diff>worst.diff))worst={id,diff,pct:diff/b[id]}}
  if(worst)out.push({c:'warn',t:T('{0} tăng {1} so với cùng kỳ tháng trước (+{2}).',`${cat(worst.id).icon} ${esc(T(cat(worst.id).name))}`,`<b>${Math.round(worst.pct*100)}%</b>`,fmtS(worst.diff))});
  for(const c of S.cats.filter(c=>c.budget>0)){const sp=a[c.id]||0;
    if(sp>c.budget) out.push({c:'bad',t:T('{0} đã vượt ngân sách {1}.',`${c.icon} ${esc(T(c.name))}`,fmtS(sp-c.budget))});
    else if(isCur&&sp>c.budget*.8) out.push({c:'warn',t:T('{0} đã dùng {1}% ngân sách.',`${c.icon} ${esc(T(c.name))}`,Math.round(sp/c.budget*100))});}
  if(inc>0){const rate=(inc-spent)/inc;out.push({c:rate<0?'bad':'',t:rate>=0?T('Tỷ lệ tiết kiệm tháng này: {0} thu nhập.',`<b>${Math.round(rate*100)}%</b>`):T('Chi tiêu đang vượt thu nhập {0}.',fmtS(spent-inc))})}
  // small frequent spending
  const small=tx.filter(t=>t.type==='ex'&&t.amt<=60000);if(small.length>=10)out.push({c:'',t:T('{0} khoản nhỏ (≤60k) cộng lại thành {1}. Chúng dễ bị bỏ qua.',small.length,`<b class="num">${fmt(small.reduce((x,t)=>x+t.amt,0))}</b>`)});
  return out.slice(0,5);
}

function donut(parts,total){
  if(!total)return `<svg viewBox="0 0 150 150" width="150" height="150"><circle cx="75" cy="75" r="56" fill="none" stroke="var(--sunk)" stroke-width="20"/></svg>`;
  let a=-Math.PI/2,h='';const R=56;
  for(const p of parts){const f=p.v/total;if(f<=0)continue;const a2=a+f*Math.PI*2;
    if(f>.9999){h+=`<circle cx="75" cy="75" r="${R}" fill="none" stroke="${p.color}" stroke-width="20"/>`;break}
    const x1=75+R*Math.cos(a),y1=75+R*Math.sin(a),x2=75+R*Math.cos(a2),y2=75+R*Math.sin(a2);
    h+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${f>.5?1:0} 1 ${x2} ${y2}" fill="none" stroke="${p.color}" stroke-width="20"/>`;a=a2}
  return `<svg viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="${T('Biểu đồ tròn theo danh mục')}">${h}<text x="75" y="72" text-anchor="middle" font-size="10">${T('Tổng chi')}</text><text x="75" y="88" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--fg)">${fmtS(total)}</text></svg>`;
}
function bars(data){ // [{label,ex,in}]
  const W=520,H=190,P=28,max=Math.max(1,...data.map(d=>Math.max(d.ex,d.in)));
  const step=Math.pow(10,Math.floor(Math.log10(max)));const nice=Math.ceil(max/step)*step;
  const bw=(W-P-8)/data.length;let g='';
  for(let i=0;i<=3;i++){const v=nice*i/3,y=H-22-(H-40)*i/3;g+=`<line x1="${P}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P-4}" y="${y+3}" text-anchor="end" font-size="9">${fmtS(v)}</text>`}
  data.forEach((d,i)=>{const x=P+8+i*bw,h1=(H-40)*d.ex/nice,h2=(H-40)*d.in/nice,w=Math.min(14,bw/3);
    g+=`<rect x="${x+bw/2-w-1}" y="${H-22-h2}" width="${w}" height="${h2}" rx="3" fill="var(--income)" opacity=".85"/><rect x="${x+bw/2+1}" y="${H-22-h1}" width="${w}" height="${h1}" rx="3" fill="${d.cur?'var(--accent)':'var(--muted)'}"/><text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="10">${d.label}</text>`});
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:300px" role="img" aria-label="${T('Biểu đồ thu chi theo tháng')}">${g}</svg></div>`;
}
function vReport(){

      <div class="hint" style="display:flex;gap:14px"><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--income)"></i> ${T('Thu')}</span><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--muted)"></i> ${T('Chi')}</span></div></div>
    <div class="card"><div class="sechead"><h2>${T('Khoản chi lớn nhất')}</h2></div>${txList(ex.sort((a,b)=>b.amt-a.amt).slice(0,5),false)}</div>

  </section>`;
}

// ---------- Sheets ----------
function close(){$('#layer').innerHTML=''}
function sheet(html,bind){
  $('#layer').innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')close()};bind&&bind();

function txSheet(t,presetDate){
  const isNew=!t;t=t?{...t}:{id:uid(),type:'ex',cat:null,amt:0,note:'',date:presetDate||ymd(new Date())};
  let repeat=false,needTouched=t.need!==undefined;
  const draw=()=>{
    const cats=S.cats.filter(c=>c.type===t.type);if(!cats.find(c=>c.id===t.cat))t.cat=cats[0].id;
    sheet(`<h3>${T(isNew?'Thêm giao dịch':'Sửa giao dịch')}</h3>
      <div class="typetog"><button data-ty="ex" class="ex ${t.type==='ex'?'on':''}">${T('Chi tiêu')}</button><button data-ty="in" class="inc ${t.type==='in'?'on':''}">${T('Thu nhập')}</button></div>
      <div><input class="amtin num" id="fa" inputmode="numeric" placeholder="0 ₫" value="${t.amt?t.amt.toLocaleString('vi-VN'):''}">
      <div class="chips" style="margin-top:8px">${['000','20000','50000','100000','500000'].map(v=>`<button data-q="${v}">${v==='000'?'×1000':'+'+fmtS(+v)}</button>`).join('')}</div></div>
      <div class="catgrid">${cats.map(c=>`<button data-c="${c.id}" class="${t.cat===c.id?'on':''}"><span class="ico" style="background:${c.color}22">${c.icon}</span><span>${esc(T(c.name))}</span></button>`).join('')}</div>
      ${t.type==='ex'?`<div class="field"><label>${T('Loại khoản chi')}</label><div class="typetog"><button data-need="1" class="${isNeed(t)?'on':''}">${T('Bắt buộc phải chi')}</button><button data-need="0" class="${!isNeed(t)?'on':''}">${T('Tùy chọn, cắt được')}</button></div></div>`:''}
      <div class="row2"><div class="field"><label for="fn">${T('Ghi chú')}</label><input id="fn" value="${esc(t.note)}" placeholder="${T('Ví dụ: bún bò')}"></div><div class="field"><label for="fd">${T('Ngày')}</label><input id="fd" type="date" value="${t.date}"></div></div>
      ${isNew?`<label class="check"><input type="checkbox" id="fr" ${repeat?'checked':''}> ${T('Lặp lại hằng tháng vào ngày này')}</label>`:''}
      <div class="btns">${isNew?'<button class="btn ghost" id="fx">'+T('Hủy')+'</button>':'<button class="btn danger" id="fdel">'+T('Xóa')+'</button>'}<button class="btn pri" id="fs">${T('Lưu')}</button></div>`,()=>{
      const fa=$('#fa');if(isNew)setTimeout(()=>fa.focus(),50);
      const readAmt=()=>parseInt(fa.value.replace(/\D/g,''))||0;
      fa.oninput=()=>{const v=readAmt();fa.value=v?v.toLocaleString('vi-VN'):''};
      const sync=()=>{t.amt=readAmt();t.note=$('#fn').value;t.date=$('#fd').value||t.date;const r=$('#fr');if(r)repeat=r.checked};
      document.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{sync();t.type=b.dataset.ty;t.cat=null;draw()});
      document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{sync();t.cat=b.dataset.c;if(!needTouched)delete t.need;draw()});
      document.querySelectorAll('[data-need]').forEach(b=>b.onclick=()=>{sync();t.need=b.dataset.need==='1';needTouched=true;if(t.need===catNeed(cat(t.cat)))delete t.need;draw()});
      document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{let v=readAmt();v=b.dataset.q==='000'?v*1000:v+ +b.dataset.q;fa.value=v.toLocaleString('vi-VN')});
      $('#fn').oninput=e=>{if(!isNew)return;const g=guessCat(e.target.value);if(g.type===t.type&&e.target.value.length>2&&g.id!=='khac'){document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c===g.id));t.cat=g.id}};
      const fx=$('#fx');if(fx)fx.onclick=close;
      const del=$('#fdel');if(del){let armed=false;del.onclick=()=>{if(!armed){armed=true;del.textContent=T('Nhấn lần nữa');return}S.tx=S.tx.filter(x=>x.id!==t.id);save();close();toast(T('Đã xóa'));render()}}
      $('#fs').onclick=()=>{sync();if(!t.amt){fa.focus();toast(T('Nhập số tiền trước nhé'));return}
        if(t.note)learn(t.note,t.cat);
        const i=S.tx.findIndex(x=>x.id===t.id);if(i>=0)S.tx[i]=t;else S.tx.push(t);
        if(isNew&&repeat){const r={id:uid(),cat:t.cat,amt:t.amt,note:t.note,type:t.type,day:+t.date.slice(8),from:t.date};S.recurring.push(r);t.rec=r.id+'@'+t.date.slice(0,7);t.id=recId(t.rec)}
        save();close();toast(T(isNew?'Đã thêm':'Đã cập nhật'));render()};
    });
  };
  draw();
}
function catSheet(c,type){
  const isNew=!c;c=c?{...c}:{id:uid(),name:'',icon:'🧾',color:COLORS[0],type,budget:0,kw:[]};
  const draw=()=>sheet(`<h3>${T(isNew?'Danh mục mới':'Sửa danh mục')}</h3>
    <div class="field"><label for="cn">${T('Tên')}</label><input id="cn" value="${esc(T(c.name))}" placeholder="${T('Ví dụ: Thú cưng')}"></div>
    <div class="field"><label>${T('Biểu tượng')}</label><div class="emojis">${EMOJI.map(e=>`<button data-e="${e}" class="${c.icon===e?'on':''}">${e}</button>`).join('')}</div></div>
    <div class="field"><label>${T('Màu')}</label><div class="colors">${COLORS.map(x=>`<button data-col="${x}" class="${c.color===x?'on':''}" style="background:${x}" aria-label="Màu ${x}"></button>`).join('')}</div></div>
    ${c.type==='ex'?`<div class="field"><label for="cb">${T('Ngân sách mỗi tháng (để trống nếu không cần)')}</label><input id="cb" inputmode="numeric" value="${c.budget?c.budget.toLocaleString('vi-VN'):''}"></div>`:''}
    ${c.type==='ex'?`<label class="check"><input type="checkbox" id="ce" ${catNeed(c)?'checked':''}> ${T('Mặc định là chi tiêu bắt buộc (vd: tiền nhà, học phí, thuốc)')}</label>`:''}
    <div class="field"><label for="ck">${T('Từ khóa để tự nhận diện (cách nhau bằng dấu phẩy)')}</label><input id="ck" value="${esc((c.kw||[]).join(', '))}" placeholder="${T('pate, cát vệ sinh, thú y')}"></div>
    <div class="btns">${isNew?'<button class="btn ghost" id="cx">'+T('Hủy')+'</button>':'<button class="btn danger" id="cdel">'+T('Xóa')+'</button>'}<button class="btn pri" id="cs">${T('Lưu')}</button></div>`,()=>{
    const sync=()=>{c.name=$('#cn').value.trim();const b=$('#cb');if(b)c.budget=parseInt(b.value.replace(/\D/g,''))||0;const ce=$('#ce');if(ce)c.essential=ce.checked;c.kw=$('#ck').value.split(',').map(s=>s.trim()).filter(Boolean)};
    document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{sync();c.icon=b.dataset.e;draw()});
    document.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{sync();c.color=b.dataset.col;draw()});
    const cb=$('#cb');if(cb)cb.oninput=()=>{const v=parseInt(cb.value.replace(/\D/g,''))||0;cb.value=v?v.toLocaleString('vi-VN'):''};
    const cx=$('#cx');if(cx)cx.onclick=close;
    const del=$('#cdel');if(del){let armed=false;del.onclick=()=>{const used=S.tx.filter(t=>t.cat===c.id).length;
      if(!armed){armed=true;del.textContent=used?T('Chuyển {0} giao dịch sang “Khác” và xóa?',used):T('Nhấn lần nữa');return}
      const fb=S.cats.find(x=>x.type===c.type&&x.id!==c.id);if(!fb){toast(T('Cần giữ ít nhất một danh mục'));return}
      const other=S.cats.find(x=>x.id==='khac'&&c.type==='ex')||fb;S.tx.forEach(t=>{if(t.cat===c.id)t.cat=other.id});
      S.cats=S.cats.filter(x=>x.id!==c.id);save();close();render()}}
    $('#cs').onclick=()=>{sync();if(!c.name){$('#cn').focus();return}const i=S.cats.findIndex(x=>x.id===c.id);if(i>=0)S.cats[i]=c;else S.cats.push(c);save();close();toast(T('Đã lưu danh mục'));render()};
  });
  draw();
}
function copyText(txt,msg){

}

function confirmSheet(text,btn,fn){sheet(`<h3>${text}</h3><div class="btns"><button class="btn ghost" id="cx">${T('Hủy')}</button><button class="btn danger" id="cy">${btn}</button></div>`,()=>{$('#cx').onclick=close;$('#cy').onclick=()=>{fn();close();render()}})}
let tt;function toast(m){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2200)}

// ---------- Cloud sync (Firebase) ----------
const CFG_KEY='sochitieu.fb';
const fb={db:null,auth:null,user:null,status:'',err:false,base:null,baseMeta:'',unsub:[],last:null};
const META_KEYS=['cats','recurring','totalBudget','learn','accent','birthYear'];
function metaOf(){const o={};META_KEYS.forEach(k=>o[k]=S[k]===undefined?null:S[k]);return JSON.stringify(o)}
function applyMeta(m){META_KEYS.forEach(k=>{if(m[k]!==undefined&&m[k]!==null)S[k]=m[k]});if(!Array.isArray(S.cats)||!S.cats.length)S.cats=JSON.parse(JSON.stringify(DEF_CATS));applyTheme()}
const DEFAULT_CFG={apiKey:"AIzaSyB-VhZAcsZK7qwPkrEk9rqyVbYJbPBKCYo",authDomain:"so-chi-tieu-19102026.firebaseapp.com",projectId:"so-chi-tieu-19102026",storageBucket:"so-chi-tieu-19102026.firebasestorage.app",messagingSenderId:"254307685544",appId:"1:254307685544:web:5d9c37c361e98df68ede9d"};
function readCfg(){try{const c=JSON.parse(localStorage.getItem(CFG_KEY));if(c&&c.apiKey)return c}catch(e){}return DEFAULT_CFG}
function parseCfg(txt){const m=String(txt).match(/\{[\s\S]*\}/);if(!m)return null;
  const s=m[0].replace(/\/\/[^\n"]*$/gm,'').replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}');
  try{const o=JSON.parse(s);return o.apiKey&&o.projectId?o:null}catch(e){return null}}
const refs=()=>{const u=fb.db.collection('users').doc(fb.user.uid);return {u,tx:u.collection('tx')}};
function setStatus(t,err){fb.status=t;fb.err=!!err;softRender()}
function softRender(){const a=document.activeElement;if(a&&a.closest&&a.closest('#view')&&/INPUT|TEXTAREA/.test(a.tagName))return;if(!$('#layer').innerHTML)render()}
async function commitOps(ops){for(let i=0;i<ops.length;i+=400){const b=fb.db.batch();ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}}
function cloudInit(){
  const cfg=readCfg();if(!cfg||!window.firebase)return;
  try{
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    fb.auth=firebase.auth();fb.db=firebase.firestore();
    fb.db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    fb.auth.onAuthStateChanged(u=>{fb.unsub.forEach(f=>f());fb.unsub=[];fb.base=null;fb.user=u;if(u)startSync();else setStatus('')});
  }catch(e){fb.status=T('Cấu hình Firebase chưa đúng:')+' '+e.message;fb.err=true}
}
async function startSync(){
  setStatus(T('Đang đồng bộ…'));
  try{
    const {u,tx}=refs();
    const [ms,ts]=await Promise.all([u.get(),tx.get()]);
    if(S.isSample){const keep={theme:S.theme,accent:S.accent,birthYear:S.birthYear};S=fresh(false);Object.assign(S,keep)}
    const cloud=new Map();ts.forEach(d=>cloud.set(d.id,{...d.data(),id:d.id}));
    if(ms.exists)applyMeta(ms.data());
    const extra=S.tx.filter(t=>!cloud.has(t.id));
    S.tx=[...cloud.values(),...extra];
    // upload what this device had that the cloud didn't
    fb.base=new Map([...cloud.values()].map(t=>[t.id,JSON.stringify(t)]));fb.baseMeta=ms.exists?metaOf():'';
    persist();runRecurring();cloudPush();
    fb.unsub.push(tx.onSnapshot(sn=>{let ch=false;
      sn.docChanges().forEach(c=>{const t={...c.doc.data(),id:c.doc.id},i=S.tx.findIndex(x=>x.id===t.id);
        if(c.type==='removed'){if(i>=0){S.tx.splice(i,1);ch=true}fb.base.delete(t.id)}
        else{const j=JSON.stringify(t);if(i<0||JSON.stringify(S.tx[i])!==j){if(i>=0)S.tx[i]=t;else S.tx.push(t);ch=true}fb.base.set(t.id,j)}});
      if(!sn.metadata.hasPendingWrites){fb.last=new Date();fb.status='ok';fb.err=false}
      if(ch)persist();softRender()},e=>setStatus(T('Lỗi đồng bộ:')+' '+e.message,true)));
    fb.unsub.push(u.onSnapshot(d=>{if(!d.exists||d.metadata.hasPendingWrites)return;applyMeta(d.data());fb.baseMeta=metaOf();persist();softRender()}));
    fb.status='ok';fb.err=false;fb.last=new Date();softRender();
  }catch(e){setStatus(T('Lỗi đồng bộ:')+' '+e.message+(String(e.code).includes('permission')?' '+T('(kiểm tra Rules của Firestore)'):''),true)}
}
function cloudPush(){
  if(!fb.user||!fb.base)return;
  const {u,tx}=refs(),now=new Map(S.tx.map(t=>[t.id,JSON.stringify(t)])),ops=[];
  now.forEach((j,id)=>{if(fb.base.get(id)!==j){const t=JSON.parse(j);delete t.id;ops.push(b=>b.set(tx.doc(id),t))}});
  fb.base.forEach((j,id)=>{if(!now.has(id))ops.push(b=>b.delete(tx.doc(id)))});
  const m=metaOf();if(m!==fb.baseMeta){const mo=JSON.parse(m);ops.push(b=>b.set(u,mo))}
  fb.base=now;fb.baseMeta=m;
  if(ops.length)commitOps(ops).then(()=>{fb.last=new Date();fb.status='ok';fb.err=false}).catch(e=>setStatus(T('Lỗi đồng bộ:')+' '+e.message,true));
}
const authMsg=e=>{const m=({'auth/invalid-credential':'Sai email hoặc mật khẩu.','auth/wrong-password':'Sai email hoặc mật khẩu.','auth/user-not-found':'Chưa có tài khoản với email này. Bấm “Tạo tài khoản”.','auth/email-already-in-use':'Email này đã có tài khoản. Bấm “Đăng nhập”.','auth/weak-password':'Mật khẩu cần ít nhất 6 ký tự.','auth/invalid-email':'Email chưa đúng định dạng.','auth/network-request-failed':'Không có mạng. Thử lại khi có kết nối.','auth/operation-not-allowed':'Bạn chưa bật đăng nhập Email/Password trong Firebase (Authentication → Sign-in method).','auth/configuration-not-found':'Bạn chưa bật Authentication trong Firebase.'})[e.code];return m?T(m):e.message};
function syncCard(){
  if(!window.firebase)return '';
  const cfg=readCfg();let body;
  if(!cfg){body=`<div class="hint" style="margin:0 0 8px">${T('Dán đoạn {0} lấy từ Firebase Console (Project settings → Your apps → Web app). Chỉ cần làm một lần trên mỗi máy.','<b>firebaseConfig</b>')}</div>

    <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div>
    <div class="field" style="margin-top:8px"><label for="pw">${T('Mật khẩu')}</label><input id="pw" type="password" autocomplete="current-password"></div>
    <div class="row2" style="margin-top:10px"><button class="btn ghost" data-act="signup">${T('Tạo tài khoản')}</button><button class="btn pri" data-act="login">${T('Đăng nhập')}</button></div>
    <div style="display:flex;justify-content:space-between;margin-top:10px"><button class="link" data-act="resetPw">${T('Quên mật khẩu')}</button><button class="link" style="color:var(--muted)" data-act="fbReset">${T('Đổi cấu hình Firebase')}</button></div>
    ${fb.status?`<div class="hint" style="color:var(--bad)">${esc(fb.status)}</div>`:''}`}
  else{const st=fb.err?esc(fb.status):fb.status==='ok'?T('Đã đồng bộ')+(fb.last?' '+T('lúc')+' '+pad(fb.last.getHours())+':'+pad(fb.last.getMinutes()):''):esc(fb.status);
    body=`<div class="setrow" style="border:0;padding-top:0"><span class="mid"><b>${esc(fb.user.email)}</b><small><span class="syncdot ${fb.err?'err':fb.status==='ok'?'ok':''}"></span>${st}</small></span><button class="link" data-act="logout">${T('Đăng xuất')}</button></div>
    <div class="hint" style="margin:0">${T('Mọi thay đổi tự lưu lên mây. Khi mất mạng, app vẫn ghi bình thường và tự đẩy lên khi có mạng lại.')}</div>`}
  return `<div class="card"><div class="sechead"><h2>${T('Đồng bộ mọi máy')}</h2></div>${body}</div>`;
}
function cloudAction(a){
  if(a==='fbSave'){const c=parseCfg($('#fbc').value);if(!c){toast(T('Không đọc được cấu hình. Hãy dán cả đoạn có apiKey và projectId.'));return}
    try{localStorage.setItem(CFG_KEY,JSON.stringify(c))}catch(e){}location.reload()}
  if(a==='fbReset'){try{localStorage.removeItem(CFG_KEY)}catch(e){}(fb.auth?fb.auth.signOut():Promise.resolve()).finally(()=>location.reload())}
  const em=$('#em')?.value.trim(),pw=$('#pw')?.value||'';
  if(a==='login'||a==='signup'){if(!fb.auth){toast(T('Cấu hình Firebase chưa đúng'));return}if(!em||!pw){toast(T('Nhập email và mật khẩu'));return}
    (a==='login'?fb.auth.signInWithEmailAndPassword(em,pw):fb.auth.createUserWithEmailAndPassword(em,pw)).then(()=>toast(T('Đã đăng nhập. Đang đồng bộ…'))).catch(e=>{fb.status=authMsg(e);fb.err=true;toast(authMsg(e));render()})}
  if(a==='resetPw'){if(!em){toast(T('Nhập email trước'));return}fb.auth.sendPasswordResetEmail(em).then(()=>toast(T('Đã gửi email đặt lại mật khẩu'))).catch(e=>toast(authMsg(e)))}
  if(a==='logout')fb.auth.signOut().then(()=>toast(T('Đã đăng xuất')));
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0);return}
  if(b.dataset.edit){txSheet(S.tx.find(t=>t.id===b.dataset.edit));return}
  if(b.dataset.day){selDay=b.dataset.day;render();return}
  if(b.dataset.rep){repMode=b.dataset.rep;render();return}
  if(b.dataset.cat){catSheet(S.cats.find(c=>c.id===b.dataset.cat));return}
  if(b.dataset.elem!==undefined){S.accent=b.dataset.elem||null;save();applyTheme();render();return}
  if(b.dataset.themeSet){S.theme=b.dataset.themeSet;save();applyTheme();render();return}
  if(b.dataset.delrec){S.recurring=S.recurring.filter(r=>r.id!==b.dataset.delrec);save();toast(T('Đã tắt khoản định kỳ'));render();return}
  const a=b.dataset.act;if(!a)return;
  if(['fbSave','fbReset','login','signup','resetPw','logout'].includes(a)){cloudAction(a);return}
  if(a==='newCat')catSheet(null,b.dataset.type);
  if(a==='goCal'){tab='cal';render()}
  if(a==='goBudgets'){tab='settings';render();setTimeout(()=>$('#budgets')?.scrollIntoView({behavior:'smooth'}),30)}
  if(a==='addDay')txSheet(null,selDay);
  if(a==='clearSample')confirmSheet(T('Xóa dữ liệu mẫu và bắt đầu sổ mới?'),T('Xóa mẫu'),()=>{const keepTheme=S.theme;S=fresh(false);S.theme=keepTheme;save()});
  if(a==='wipe')confirmSheet(T('Xóa toàn bộ giao dịch, danh mục và cài đặt?'),T('Xóa hết'),()=>{S=fresh(false);save();applyTheme()});
  if(a==='backup')copyText(JSON.stringify(S),T('Đã sao chép bản sao lưu. Hãy dán vào Ghi chú hoặc email cho chính bạn.'));
  if(a==='restore')restoreSheet();
  if(a==='csv'){const k=repMode==='year'?String(cur.getFullYear()):monthKey(cur);
    const rows=[['Ngày','Loại','Danh mục','Bắt buộc','Ghi chú','Số tiền'].map(x=>T(x))].concat(S.tx.filter(t=>t.date.startsWith(k)).sort((x,y)=>x.date.localeCompare(y.date)).map(t=>[t.date,T(t.type==='in'?'Thu':'Chi'),T(cat(t.cat).name),t.type==='ex'?T(isNeed(t)?'Bắt buộc':'Tùy chọn'):'',T(t.note),t.type==='in'?t.amt:-t.amt]));
    copyText(rows.map(r=>r.join('\t')).join('\n'),T('Đã sao chép. Dán thẳng vào Excel hoặc Google Sheets.'))}
});
